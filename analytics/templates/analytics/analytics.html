{% load static %}
<html>
<head>
    <title>Аналитика товаров Wildberries</title>
    <link rel="stylesheet" href="{% static 'analytics/css/style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Аналитика товаров</h1>
        
        <!-- Фильтры -->
        {% include 'analytics/partials/filters.html' %}
        
        <!-- Таблица товаров -->
        {% include 'analytics/partials/table.html' %}
        
        <!-- Графики -->
        {% include 'analytics/partials/charts.html' %}
    </div>

    <script src="{% static 'analytics/js/filters.js' %}"></script>
    <script src="{% static 'analytics/js/sort.js' %}"></script>
    <script src="{% static 'analytics/js/charts.js' %}"></script>
    
    <script>
        // Инициализация графиков
        initCharts({
            priceData: {{ price_data|safe }},
            discountData: {{ discount_data|safe }}
        });
    </script>
</body>
</html>
