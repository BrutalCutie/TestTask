<div class="filters">
    <form id="filter-form">
        <div class="filter-group">
            <label>Цена:</label>
            <input type="number" name="min_price" placeholder="Мин" value="{{ filters.min_price }}">
            <input type="number" name="max_price" placeholder="Макс" value="{{ filters.max_price }}">
        </div>

        <div class="filter-group">
            <label>Рейтинг от:</label>
            <input type="number" step="0.1" name="min_rating" value="{{ filters.min_rating }}">
        </div>

        <div class="filter-group">
            <label>Отзывов от:</label>
            <input type="number" name="min_reviews" value="{{ filters.min_reviews }}">
        </div>

        <button type="submit">Применить</button>
    </form>
</div>
